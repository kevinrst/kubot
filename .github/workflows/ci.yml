name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: test cmd
        run: go test ./cmd/...
      - name: test ai
        run: go test ./internal/ai/...
      - name: test diagnose
        run: go test ./internal/diagnose/...
      - name: test k8s
        run: go test ./internal/k8s/...
      - name: test mcp
        run: go test ./internal/mcp/...
      - name: test model
        run: go test ./internal/model/...
      - name: test render
        run: go test ./internal/render/...
