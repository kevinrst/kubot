name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write # cosign keyless signing via GitHub OIDC
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Sign checksums.txt with cosign (keyless) and attach the bundle,
      # so install.sh can verify provenance, not just integrity.
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign-blob --yes --bundle dist/checksums.txt.cosign.bundle dist/checksums.txt
      - run: gh release upload ${{ github.ref_name }} dist/checksums.txt.cosign.bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
